name: Build iOS App

on:
  push:
    branches: [ main, master, account-tab ]
  pull_request:
    branches: [ main, master, account-tab ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build iOS IPA (for iPhone Sideloading)
    runs-on: macos-14
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx9216m -XX:+UseParallelGC"
      _JAVA_OPTIONS: "-Xmx9216m"
      KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx9216m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for Physical iOS Device (IPA)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p build_output/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Release-iphoneos/iosApp.app build_output/Payload/
          cd build_output
          zip -r D-Spot.ipa Payload
          cd ..

      - name: Upload IPA (for Sideloadly / AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: D-Spot-iOS-Device
          path: build_output/D-Spot.ipa

  build-ios-simulator:
    name: Build iOS Simulator App (VirtualBox)
    runs-on: macos-14
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx9216m -XX:+UseParallelGC"
      _JAVA_OPTIONS: "-Xmx9216m"
      KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx9216m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for iOS Simulator
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

          cd ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Release-iphonesimulator/
          zip -r iosApp-Simulator.zip iosApp.app

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/iosApp-Simulator.zip
