name: Build iOS App

on:
  push:
    branches: [ main, master, account-tab ]
  pull_request:
    branches: [ main, master, account-tab ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build iOS IPA (for iPhone Sideloading)
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx9216m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      _JAVA_OPTIONS: "-Xmx9216m"
      KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx9216m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for Physical iOS Device (IPA)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          CPU_CORES=$(sysctl -n hw.ncpu)
          echo "Building on Apple Silicon with $CPU_CORES CPU cores..."
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -jobs "$CPU_CORES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

          mkdir -p build_output/Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Release-iphoneos/iosApp.app build_output/Payload/
          cd build_output
          zip -r D-Spot.ipa Payload
          cd ..

      - name: Upload IPA (for Sideloadly / AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: D-Spot-iOS-Device
          path: build_output/D-Spot.ipa
