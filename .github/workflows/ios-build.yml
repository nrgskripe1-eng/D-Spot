name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Binibigyan ka ng button sa GitHub para ma-trigger ang build nang manual

jobs:
  build-ios:
    name: Build iOS Framework and App
    runs-on: macos-14 # Gumagamit ng Apple Silicon (M1/M2) runner sa GitHub Cloud

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build KMP iOS Frameworks
        run: |
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace
          ./gradlew :composeApp:compileKotlinIosArm64 --stacktrace

      - name: Build with Xcode (Simulator Build)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compress App Bundle for Sideload / Simulator
        run: |
          cd ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Release-iphonesimulator/ || cd ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphonesimulator/
          zip -r iosApp-Simulator.zip iosApp.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/iosApp-Simulator.zip

