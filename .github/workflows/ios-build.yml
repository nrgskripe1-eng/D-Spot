name: Build iOS App

on:
  push:
    branches: [ main, master, account-tab ]
  pull_request:
    branches: [ main, master, account-tab ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Framework and App
    runs-on: macos-14
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx9216m -XX:+UseParallelGC"
      _JAVA_OPTIONS: "-Xmx9216m"
      KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx9216m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build KMP iOS Framework for Simulator
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
            --no-configuration-cache --stacktrace || {
            echo "::error::Compilation failed! Checking errors below:"
            ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 \
              --no-configuration-cache --info 2>&1 | grep -C 3 -E "e: |error:|Compilation finished with errors"
            exit 1
          }
          ./gradlew --stop

      - name: Build with Xcode (Simulator Build)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compress App Bundle for Sideload / Simulator
        run: |
          cd ~/Library/Developer/Xcode/DerivedData/iosApp-*/Build/Products/Release-iphonesimulator/ || cd ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphonesimulator/
          zip -r iosApp-Simulator.zip iosApp.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/iosApp-Simulator.zip
