name: Build iOS Simulator (Manual)

on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    name: Build iOS Simulator App (VirtualBox / Mac)
    runs-on: macos-15
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx9216m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      _JAVA_OPTIONS: "-Xmx9216m"
      KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx9216m"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for iOS Simulator
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          CPU_CORES=$(sysctl -n hw.ncpu)
          echo "Building Simulator App with $CPU_CORES CPU cores..."
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -jobs "$CPU_CORES" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

          mkdir -p build_output
          SIM_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" -path "*/Release-iphonesimulator/*" | head -1)
          if [ -n "$SIM_APP" ]; then
            echo "Found simulator app at: $SIM_APP"
            cd "$(dirname "$SIM_APP")"
            zip -r "$GITHUB_WORKSPACE/build_output/iosApp-Simulator.zip" iosApp.app
            cd "$GITHUB_WORKSPACE"
          else
            echo "::error::Simulator app not found!"
            exit 1
          fi

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-Simulator
          path: build_output/iosApp-Simulator.zip
