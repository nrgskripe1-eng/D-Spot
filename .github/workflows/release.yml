name: Release

# Trigger: push any tag starting with "v" (e.g. v2.3.1, v2.4.0, v3.0.0).
# What it does:
#   1. Bumps version-name and version-code in libs.versions.toml to match the tag.
#   2. Commits the bump back to the branch the tag points at.
#   3. Builds Android (Full + FOSS) and all Desktop platforms in parallel.
#   4. Wraps macOS .zip files into polished .dmg installers.
#   5. Publishes a GitHub Release with all artifacts attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.3.1)'
        required: true
        default: '2.3.1'
        type: string

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Bump version-name + version-code in libs.versions.toml and commit it back.
  # ─────────────────────────────────────────────────────────────────────────────
  bump-version:
    name: Bump version in libs.versions.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      version_code: ${{ steps.parse.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need a full clone so we can push the commit back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.version }}"
            VERSION="${RAW_VER#v}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"          # e.g. v2.3.1
            VERSION="${TAG#v}"                # strip leading "v" → 2.3.1
          fi

          # Read current version-code and increment by 1
          CURRENT_CODE=$(grep '^version-code' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          NEW_CODE=$((CURRENT_CODE + 1))

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION (tag: $TAG, code: $NEW_CODE)"

      - name: Update libs.versions.toml
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          CODE="${{ steps.parse.outputs.version_code }}"

          sed -i "s/^version-name = .*/version-name = \"$VERSION\"/" gradle/libs.versions.toml
          sed -i "s/^version-code = .*/version-code = \"$CODE\"/"    gradle/libs.versions.toml

          echo "--- Updated versions ---"
          grep '^version-' gradle/libs.versions.toml

      - name: Commit and push version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump version to ${{ steps.parse.outputs.version }} [skip ci]"
          # Push to whichever branch HEAD is on (main, dev, etc.)
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD) || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2a. Build Android APKs (Full + FOSS) — runs on Ubuntu, needs bump-version.
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APKs (Full + FOSS)
    runs-on: ubuntu-latest
    needs: bump-version
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Write secrets to local.properties
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}"              > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"       >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"          >> ./local.properties

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.BASE_64_SIGNING_KEY }}" ]; then
            echo "${{ secrets.BASE_64_SIGNING_KEY }}" | base64 -d > dspot.jks
          fi

      - name: Make scripts and gradlew executable and normalize line endings
        run: |
          sed -i 's/\r$//' ./gradlew ./build_and_sign_apk.sh
          chmod +x ./gradlew ./build_and_sign_apk.sh

      - name: Build Full release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties
          bash ./build_and_sign_apk.sh --release --full

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-full
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Reset gradle.properties for FOSS build
        run: sed -i '/^isFullBuild=/d' ./gradle.properties

      - name: Build FOSS release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties
          bash ./build_and_sign_apk.sh --release --foss

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-foss
          path: androidApp/build/outputs/apk/release/*.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # 2b. Build Desktop Windows package (.msix + offline installer)
  # ─────────────────────────────────────────────────────────────────────────────
  build-desktop:
    name: Build Desktop Windows package
    runs-on: ubuntu-22.04
    needs: bump-version
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Write secrets to local.properties
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}"          > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"       >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"          >> ./local.properties

      - name: Set full build flag
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Make scripts and gradlew executable and normalize line endings
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew scripts/windows/* 2>/dev/null || true

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Unpack prebuilt mpv-natives for Conveyor
        run: |
          mkdir -p mpv-natives
          for f in mpv-natives-bundle/*.tar.gz; do
            tar -xzf "$f" -C mpv-natives/ 2>/dev/null || tar -xzf "$f"
          done
          # Ensure directories are in mpv-natives/
          for d in windows-x64 windows-arm64 linux-x64 macos-x64 macos-arm64; do
            if [ -d "$d" ] && [ ! -d "mpv-natives/$d" ]; then
              mv "$d" mpv-natives/
            fi
          done
          echo "Unpacked mpv-natives directory contents:"
          ls -la mpv-natives/

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Determine Conveyor signing key
        id: conveyor_key
        run: |
          if [ -n "${{ secrets.CONVEYOR_SIGNING_KEY }}" ]; then
            echo "key=${{ secrets.CONVEYOR_SIGNING_KEY }}" >> $GITHUB_OUTPUT
          else
            echo "Notice: CONVEYOR_SIGNING_KEY not set. Using self-signed fallback key."
            echo "key=abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art" >> $GITHUB_OUTPUT
          fi

      - name: Run Conveyor (Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ steps.conveyor_key.outputs.key }}

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          if [ ! -f output/dspot.crt ]; then
            echo "::error::output/dspot.crt missing — Conveyor signing must have failed"
            exit 1
          fi
          msix=$(ls output/dspot-*.x64.msix 2>/dev/null | head -1)
          if [ -z "$msix" ]; then
            echo "::error::No dspot-*.x64.msix found in output/"
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/dspot.crt             "$stage/"
          cp "$msix"                       "$stage/"
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/D-Spot-Windows-installer.zip" \
            install.bat dspot.crt "$(basename "$msix")" )
          rm -rf "$stage"
          ls -lh installers/

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: installers/D-Spot-Windows-installer.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Publish GitHub Release with all artifacts (Android + Windows + Linux)
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [bump-version, build-android, build-desktop]
    steps:
      - name: Download Full APK
        uses: actions/download-artifact@v4
        with:
          name: apk-full
          path: release-files/android

      - name: Download FOSS APK
        uses: actions/download-artifact@v4
        with:
          name: apk-foss
          path: release-files/android-foss

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-files/windows

      - name: Show all release files
        run: find release-files/ -type f | sort

      - name: Rename APKs with version tag
        run: |
          VERSION="${{ needs.bump-version.outputs.version }}"
          # Full APK
          for f in release-files/android/*.apk; do
            mv "$f" "release-files/android/D-Spot-${VERSION}-full.apk"
          done
          # FOSS APK
          for f in release-files/android-foss/*.apk; do
            mv "$f" "release-files/android-foss/D-Spot-${VERSION}-foss.apk"
          done

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: "D-Spot ${{ needs.bump-version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/android/*.apk
            release-files/android-foss/*.apk
            release-files/windows/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
