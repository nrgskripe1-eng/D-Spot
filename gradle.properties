## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Multi-core Parallel Execution & Build Caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.daemon=true
org.gradle.workers.max=4

# JVM & Memory Settings (9GB for large Multiplatform compilations)
org.gradle.jvmargs=-Xmx9216m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
kotlin.native.jvmArgs=-Xmx9216m

# Incremental Compilations
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.native=true
kotlin.native.binary.enableReleaseBinaryCache=true
ksp.incremental=true
ksp.useKSP2=true

# Android Optimizations
android.enableJetifier=false
android.nonFinalResIds=false
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.usesSdkInManifest.disallowed=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false

# Kotlin & Multiplatform Settings
kotlin.code.style=official
kotlin.jvm.target.validation.mode=IGNORE
kotlin.native.binary.bundleId=com.mika.dspot
kotlin.native.ignoreDisabledTargets=true
org.gradle.unsafe.configuration-cache=true
isFullBuild=true
